#routine-setup-preview{--rp-bg:#0d0e11;--rp-surface:#17181d;--rp-text:#f2f2f5;--rp-sub:#9b9da8;--rp-line:#ffffff14;--rp-red:#ff344f;--rp-radius:18px;--rp-time:460ms;--rp-ease:cubic-bezier(.22,1,.36,1);font-family:RoutinePreview,Inter,Arial,sans-serif;color:var(--rp-text);width:100%;font-size:14px;line-height:1.5;color-scheme:dark}
#routine-setup-preview *{box-sizing:border-box}
#routine-setup-preview button,#routine-setup-preview input,#routine-setup-preview select{font:inherit}
#routine-setup-preview button:disabled{cursor:wait;opacity:.5}
#routine-setup-preview button:focus-visible,#routine-setup-preview input:focus-visible,#routine-setup-preview select:focus-visible{outline:2px solid #aab8ff;outline-offset:4px}
#routine-setup-preview .rp-toolbar{display:flex;align-items:center;gap:20px;padding:0 100px 16px 0;min-height:52px;flex-wrap:wrap}
#routine-setup-preview .rp-tabs{display:flex;gap:4px;padding:4px;background:#17181d;border:1px solid #ffffff12;border-radius:12px}
#routine-setup-preview .rp-tabs button{border:0;background:transparent;color:#a9a9b3;border-radius:8px;padding:7px 14px;font-size:12px;transition:background .25s,color .25s}
#routine-setup-preview .rp-tabs button[aria-pressed=true]{background:#2a2b32;color:#f5f5f7;box-shadow:0 1px 4px #0003}
#routine-setup-preview .rp-preview-label{font-size:10px;color:#92929f;letter-spacing:.12em}
#routine-setup-preview .rp-window{isolation:isolate;position:relative;overflow:hidden;background:var(--rp-bg);border:1px solid #303137;border-radius:var(--rp-radius);box-shadow:0 22px 60px #0002;min-height:552px}
#routine-setup-preview .rp-header{height:84px;padding:26px 30px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3}
#routine-setup-preview .rp-brand{display:flex;align-items:center;gap:10px}
#routine-setup-preview .rp-symbol{width:27px;height:24px;object-fit:contain}
#routine-setup-preview .rp-wordmark{width:103px;height:28px;object-fit:contain;filter:brightness(0) invert(1)}
#routine-setup-preview .rp-caption{display:flex;align-items:center;gap:18px}
#routine-setup-preview .rp-caption>span{font-size:9px;letter-spacing:.1em;color:#878995}
#routine-setup-preview .rp-close{display:grid;place-items:center;width:32px;height:32px;border:1px solid transparent;border-radius:9px;background:transparent;color:#a0a2ad;transition:color .2s,background .2s}
#routine-setup-preview .rp-close:hover{background:#ffffff0b;color:white}
#routine-setup-preview .rp-close svg{width:16px;height:16px}
#routine-setup-preview .rp-stage{position:relative;min-height:467px;display:flex;flex-direction:column}
#routine-setup-preview .rp-page{min-height:467px;display:flex;flex-direction:column;position:relative}
#routine-setup-preview .rp-copy{padding:36px 36px 14px;position:relative;z-index:2;width:60%;pointer-events:none}
#routine-setup-preview .rp-overline{font-size:10px;font-weight:550;letter-spacing:.14em;color:#b3b5bf;margin:0 0 16px;text-transform:uppercase}
#routine-setup-preview h1{font-size:clamp(32px,5.6vw,46px);line-height:1.07;letter-spacing:-.065em;font-weight:550;color:var(--rp-text);margin:0 0 19px;max-width:400px}
#routine-setup-preview p{margin:0;color:var(--rp-sub);font-size:13px;line-height:1.7;max-width:300px}
#routine-setup-preview .rp-art{position:absolute;inset:-35px 0 80px 35%;overflow:hidden;pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000 16%,#000 89%,transparent),linear-gradient(0deg,transparent,#000 24%,#000 88%,transparent);mask-composite:intersect;opacity:.85}
#routine-setup-preview .rp-art img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform:scale(1.05);filter:saturate(.8);transition:filter 1.2s ease,opacity .8s ease}
#routine-setup-preview .rp-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0d0e11b3,transparent 50%),linear-gradient(0deg,#0d0e11,transparent 45%);pointer-events:none}
#routine-setup-preview .rp-art .rp-art-light{position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#ff345913 45%,transparent 70%);mix-blend-mode:screen;opacity:.55;transform:translateX(-12%);transition:transform 1.8s ease,opacity 1.8s ease}
#routine-setup-preview .rp-window:hover .rp-art-light{transform:translateX(10%);opacity:1}
#routine-setup-preview .rp-bottom{padding:20px 36px 27px;position:relative;z-index:2;margin-top:auto;background:linear-gradient(0deg,var(--rp-bg) 82%,#0d0e1100)}
#routine-setup-preview .rp-action-row{display:flex;align-items:center;gap:16px;justify-content:space-between}

   const saved=null;

 const post=(action,extra={})=>bridge?.postMessage({action,...extra});
 const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let nativeDialog=null,nativeQueue=Promise.resolve(),currentProgress={fraction:0,label:''};

 function paintProgress(){const label=stage.querySelector('#rp-status'),pct=stage.querySelector('#rp-percent'),fill=stage.querySelector('.rp-fill'),track=stage.querySelector('[role=progressbar]');if(label)label.textContent=currentProgress.label;if(pct)pct.textContent=currentProgress.fraction==null?'':Math.round(currentProgress.fraction*100)+'%';if(fill&&currentProgress.fraction!=null)fill.style.transform='scaleX('+currentProgress.fraction+')';if(track&&currentProgress.fraction!=null)track.setAttribute('aria-valuenow',Math.round(currentProgress.fraction*100));}
 function applyDetails(message){
  if(message.view==='error'){stage.querySelector('h1').textContent=message.title;stage.querySelector('h1').style.whiteSpace='pre-line';stage.querySelector('.rp-copy>p').textContent=message.description;stage.querySelector('.rp-status-code').textContent=message.code;}
