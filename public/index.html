<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#090a0c" />
    <title>Routine · Seu próximo nível</title>
    <link rel="icon" href="/brand/routine-symbol.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico?v=official" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/routine.css" />
    <link rel="stylesheet" href="/brand-motion.css" />
  </head>
  <body>
    <div class="shell">
      <aside id="sidebar" aria-label="Barra lateral">
        <div class="logo">
          <div class="brand-line">
            <img
              src="/brand/routine-symbol.svg"
              alt=""
              width="40"
              height="40"
            /><img
              class="brand-wordmark"
              src="/brand/routine-wordmark.svg"
              alt="Routine"
              width="114"
              height="29"
            />
          </div>
          <span>Seu ritmo. Sua evolução.</span>
        </div>
        <div class="sidebar-tools">
          <button
            type="button"
            class="command-trigger"
            onclick="openRoutineCommands()"
            aria-label="Buscar no Routine"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <circle cx="10.5" cy="10.5" r="7" />
              <path d="m16 16 5 5" /></svg
            ><span>Ir para…</span><kbd>Ctrl K</kbd>
          </button>
          <button
            class="sidebar-toggle"
            id="sidebarToggle"
            type="button"
            onclick="toggleSidebar()"
            aria-controls="sidebar"
            aria-expanded="true"
            title="Recolher barra lateral"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <rect x="3" y="4" width="18" height="16" rx="4" />
              <path d="M9 4v16m7-10-2 2 2 2" /></svg
            ><span>Recolher menu</span>
          </button>
        </div>
        <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
        <div class="sidefoot">
          <span class="dot"></span><span id="connection">Conectando…</span
          ><br />Feito para a sua constância.<br /><span style="color: #575c65"
            >Routine · Local</span
          >
        </div>
      </aside>
      <main>
        <header class="topbar">
          <span class="mobile-brand" aria-label="Routine"
            ><img
              src="/brand/routine-symbol.svg"
              alt=""
              width="32"
              height="32" /><img
              class="brand-name brand-wordmark"
              src="/brand/routine-wordmark.svg"
              alt=""
              width="90"
              height="23" /></span
          ><span class="eyebrow">Seu espaço de treino</span>
          <div class="top-actions">
            <button
              type="button"
              class="mobile-command"
              aria-label="Buscar no Routine"
              onclick="openRoutineCommands()"
            >
              <svg
                viewBox="0 0 24 24"
                width="19"
                height="19"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <circle cx="10.5" cy="10.5" r="7" />
                <path d="m16 16 5 5" />
              </svg>
            </button>
            <span class="pill" id="dateLabel"></span>
          </div>
        </header>
        <div id="syncPanel" class="sync-panel">
          <span id="syncStatus" role="status">Conectando ao PC…</span
          ><button
            class="btn small"
            id="syncAction"
            hidden
            onclick="showPendingConflict()"
          >
            Reenviar
          </button>
        </div>
        <div id="app"><p class="empty">Preparando seu espaço…</p></div>
      </main>
    </div>
    <dialog id="modal" aria-label="Painel do Routine"></dialog>
    <div id="toast" class="toast" hidden role="status"></div>
    <script src="/diagnostics.js"></script>
    <script src="/motion.js"></script>
    <script src="/interface.js"></script>
    <script src="/training.js"></script>
    <script src="/sync.js"></script>
    <script src="/backups.js"></script>
    <script src="/diary-tools.js"></script>
    <script src="/insights.js"></script>
    <script src="/experience.js"></script>
    <script src="/mobile-access.js"></script>
    <script src="/app.js"></script>
    <script src="/brand-motion.js"></script>
  </body>
</html>
