<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Routine · Constância</title>
  </head>
  <body>
    <div
      id="routine-raycast-glass-final"
      aria-label="Routine — referência Raycast"
    >
      <div
        class="rr-scene"
        role="img"
        aria-label="Fundo de vidro diagonal com a configuração original do Raycast e a logo 3D de vidro do Routine em primeiro plano. O mouse conduz suavemente o campo de cores por trás do vidro."
      >
        <canvas aria-hidden="true"></canvas>
        <div class="rr-fade" aria-hidden="true"></div>
        <div class="rr-brand" aria-hidden="true">
          <svg viewBox="0 0 550 257" xmlns="http://www.w3.org/2000/svg">
            <path
              fill="currentColor"
              d="M 3.3 256.8 Q 0 256.8 1.7 253.6 L 115 2 Q 116 0 118.2 0 L 330.6 0 Q 331.9 0 332.8 1.3 L 355 39 C 362.5 51.8 372 58.5 384 58.5 C 396 58.5 403.5 54.5 410 47 C 417 39.3 422 34.5 430 34.5 L 476 34.5 Q 477.5 34.5 478.1 36.1 L 549 254 Q 550 256.8 547 256.8 L 401 256.8 C 378 179.5 317 129 242 129 C 166 129 110.8 179.5 83 256.8 Z"
            />
          </svg>
        </div>
        <span class="rr-status" role="status">Preparando a cena…</span>
      </div>
      <div class="rr-controls">
        <button
          class="rr-play cursor-interaction"
          type="button"
          aria-pressed="false"
        >
          Pausar animação
        </button>
      </div>
      <script type="application/json" class="rr-reference">
        {
          "scene": {
            "backgroundEnabled": true,
            "backgroundColor": { "r": 7, "g": 9, "b": 10 },
            "cubeZ": -9,
            "cubeY": 0,
            "glassZ": 0,
            "glassRotation": 0.73,
            "cameraZ": 16.54,
            "dpr": 2,
            "monitorPerf": true
          },
          "glass": {
            "enabled": true,
            "thickness": 1,
            "roughness": 0.35,
            "anisotropicBlur": 2.88,
            "ior": 1.5,
            "resolution": 1024,
            "chromaticAberration": 3,
            "distortion": 0,
            "distortionScale": 0.08,
            "temporalDistortion": 0,
            "transmission": 1,
            "samples": 6,
            "mobileSamples": 5,
            "animateDistortion": true,
            "time": 0
          },
          "cylinder": {
            "count": 16,
            "radius": 0.5,
            "height": 15,
            "subdivisions": 8
          },
          "cubeShader": {
            "speed": 0.1,
            "size": 0.99,
            "color1": { "r": 244, "g": 254, "b": 255 },
            "color2": { "r": 255, "g": 122, "b": 152 },
            "color3": { "r": 184, "g": 2, "b": 50 },
            "color4": { "r": 255, "g": 22, "b": 42 }
          },
          "cubeInteraction": {
            "enabled": true,
            "rotationInfluence": 0.3,
            "translationInfluence": 0.2
          },
          "postProcessing": {
            "enabled": false,
            "dithering": false,
            "invertDither": false,
            "useColor": true,
            "colorThreshold": 1024,
            "matrixSize": 8,
            "ditherScale": 4
          }
        }
      </script>
    </div>
    <style>
      #routine-raycast-glass-final {
        width: 100%;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #routine-raycast-glass-final * {
        box-sizing: border-box;
      }
      #routine-raycast-glass-final .rr-scene {
        position: relative;
        isolation: isolate;
        width: 100%;
        aspect-ratio: 1200/895;
        overflow: hidden;
        background: #07080a;
        touch-action: pan-y;
      }
      #routine-raycast-glass-final canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #routine-raycast-glass-final .rr-fade {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: none;
      }
      #routine-raycast-glass-final .rr-brand {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: #fff;
        animation: rr-reference-enter 1s both;
      }
      #routine-raycast-glass-final.rr-glass-ready .rr-brand {
        visibility: hidden;
        animation: none;
      }
      #routine-raycast-glass-final .rr-brand svg {
        display: block;
        width: 45%;
        height: auto;
        filter: drop-shadow(0 4px 4px #00000026);
      }
      #routine-raycast-glass-final .rr-status {
        position: absolute;
        inset: auto 16px 18px;
        text-align: center;
        color: #d5d5d8;
        font-size: 12px;
        pointer-events: none;
      }
      #routine-raycast-glass-final .rr-controls {
        display: flex;
        justify-content: flex-end;
        padding-top: 12px;
      }
      #routine-raycast-glass-final .rr-play {
        min-height: 44px;
        padding: 10px 14px;
        border: 1px solid #ffffff1a;
        border-radius: 9px;
        background: #111214;
        color: #d9dadd;
        font:
          500 12px/1.4 Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      #routine-raycast-glass-final .rr-play:hover {
        background: #1b1c1f;
      }
      @keyframes rr-reference-enter {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 600px) {
        #routine-raycast-glass-final .rr-scene {
          aspect-ratio: 390/760;
        }
        #routine-raycast-glass-final.rr-glass-ready .rr-brand {
          visibility: hidden;
          animation: none;
        }
        #routine-raycast-glass-final .rr-brand svg {
          width: 64%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #routine-raycast-glass-final .rr-brand {
          animation: none;
        }
      }
    </style>
    <style>
      #routine-raycast-glass-final.rr-workout .rr-scene {
        aspect-ratio: auto;
        height: 100dvh;
      }
      #routine-raycast-glass-final.rr-workout .rr-brand {
        display: none;
      }
      #routine-raycast-glass-final.rr-workout .rr-fade {
        background: none;
      }
    </style>
    <script src="/scene/guard.js"></script>
    <script src="/scene/scene.bundle.js" defer></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #07080a;
        overflow: hidden;
      }
      #routine-raycast-glass-final .rr-scene {
        aspect-ratio: 1200/895;
      }
      #routine-raycast-glass-final .rr-controls {
        position: absolute;
        bottom: 7px;
        right: 9px;
        padding: 0;
      }
      #routine-raycast-glass-final .rr-play {
        background: #07080ab8;
        font-size: 11px;
        padding: 8px 10px;
      }
      #routine-raycast-glass-final .rr-brand svg {
        width: 45%;
      }
    </style>
    <style>
      .rr-poster {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 22%;
        background: #07080a;
        pointer-events: none;
      }
      .rr-poster-banner {
        object-fit: cover;
        padding: 0;
      }
      #routine-raycast-glass-final canvas {
        visibility: hidden;
      }
      #routine-raycast-glass-final.rr-rendered canvas {
        visibility: visible;
      }
      #routine-raycast-glass-final .rr-brand {
        display: none;
      }
      #routine-raycast-glass-final.rr-rendered .rr-poster {
        visibility: hidden;
      }
    </style>
    <style>
      #routine-raycast-glass-final .rr-controls {
        top: 12px;
        bottom: auto;
        right: 12px;
      }
      #routine-raycast-glass-final .rr-play {
        background: #10111570;
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border-color: #ffffff24;
        box-shadow: inset 0 1px #ffffff08;
      }

      #routine-raycast-glass-final .rr-status {
        top: 66px;
        bottom: auto;
        padding: 8px 10px;
        border-radius: 9px;
        background: #07080ad9;
      }
    </style>
  </body>
</html>
